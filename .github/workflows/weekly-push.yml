name: 服事提醒推播

on:
  schedule:
    # 台北時間 07:00–21:00 每小時執行（UTC = 台北 - 8）
    - cron: '0 23 * * *'   # 台北 07:00（前一天 UTC 23:00）
    - cron: '0 0 * * *'    # 台北 08:00
    - cron: '0 1 * * *'    # 台北 09:00
    - cron: '0 2 * * *'    # 台北 10:00
    - cron: '0 3 * * *'    # 台北 11:00
    - cron: '0 4 * * *'    # 台北 12:00
    - cron: '0 5 * * *'    # 台北 13:00
    - cron: '0 6 * * *'    # 台北 14:00
    - cron: '0 7 * * *'    # 台北 15:00
    - cron: '0 8 * * *'    # 台北 16:00
    - cron: '0 9 * * *'    # 台北 17:00
    - cron: '0 10 * * *'   # 台北 18:00
    - cron: '0 11 * * *'   # 台北 19:00
    - cron: '0 12 * * *'   # 台北 20:00
    - cron: '0 13 * * *'   # 台北 21:00
  workflow_dispatch:       # 允許手動觸發（測試用）

jobs:
  send-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安裝依賴
        run: cd scripts && npm install

      - name: 發送服事提醒推播
        env:
          VAPID_PUBLIC_KEY:  ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          GAS_URL:           ${{ secrets.GAS_URL }}
        run: node scripts/send-push.js
